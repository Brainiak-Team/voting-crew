# Refreshes odds.json from Kalshi's public API (no key needed) and commits it.
# The site host then serves the updated static file; visitors never contact Kalshi.
name: refresh-odds
on:
  schedule:
    - cron: '*/10 * * * *'   # GitHub may delay scheduled runs by several minutes
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node fetch-odds.mjs
      - name: Commit if changed
        run: |
          git config user.name "odds-bot"
          git config user.email "odds-bot@users.noreply.github.com"
          git add odds.json
          git diff --cached --quiet || (git commit -m "Refresh odds" && git push)

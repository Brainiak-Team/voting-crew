<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page not found &mdash; My Voting Crew</title>
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <style>
    :root {
      --bg: #ffffff;
      --ink: #111111;
      --line: #111111;
      --accent: #c8102e;
      --font: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --shadow: 4px 4px 0 var(--accent);
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; min-height: 100vh;
      background: var(--bg); color: var(--ink);
      font-family: var(--font); line-height: 1.3;
      display: flex; align-items: center; justify-content: center;
      padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 20px max(16px, env(safe-area-inset-left));
    }
    .box {
      max-width: 480px; width: 100%;
      border: 2px solid var(--line); box-shadow: 6px 6px 0 var(--accent);
      padding: 28px 24px;
    }
    h1 { margin: 0; font-size: 3rem; font-weight: 900; letter-spacing: -0.02em; }
    p { margin: 14px 0 0; font-size: 1.05rem; font-weight: 700; }
    a.home {
      display: inline-block; margin-top: 20px;
      font: inherit; font-weight: 800; font-size: 1.05rem; color: var(--ink);
      background: var(--bg); text-decoration: none;
      border: 2px solid var(--line); box-shadow: var(--shadow);
      padding: 8px 16px; min-height: 44px; line-height: 28px;
    }
    a.home:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--accent); }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <p>That page isn't here. Your list, if you have one, is safe &mdash; it lives on your own device, not on this address.</p>
    <a class="home" href="/">&lsaquo; Back to your list</a>
  </div>
</body>
</html>

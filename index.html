<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bring your crew. Have an impact!</title>
  <meta name="description" content="Who will you bring to the polls? A private list of the friends you'll take to vote. Your list stays on your device.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; img-src data:; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <style>
    /* ---- Theme. Restyle a copy of this page by editing these values. ---- */
    :root {
      --bg: #ffffff;
      --ink: #111111;
      --muted: #555555;
      --line: #111111;
      --accent: #c8102e;      /* shadows, Republican bar */
      --other: #8a8a8a;       /* other candidates' bars */
      --track: #ececec;       /* empty part of bars */
      --font: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --shadow: 4px 4px 0 var(--accent);
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      line-height: 1.3;
    }
    .app {
      max-width: 960px;
      margin: 0 auto;
      padding: max(12px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) 16px max(14px, env(safe-area-inset-left));
      display: grid;
      gap: 10px;
      /* Portrait (phones held upright): stacked. */
      grid-template-columns: 1fr;
      grid-template-areas:
        "head"
        "odds"
        "arrow"
        "list"
        "foot";
    }
    h1 {
      grid-area: head;
      margin: 0;
      font-size: clamp(1.7rem, 8.4vw, 3rem);
      font-weight: 900;
      line-height: 1.02;
      letter-spacing: -0.02em;
    }
    h1 span { display: inline-block; }

    /* ---- Odds ---- */
    .odds { grid-area: odds; }
    .odds[hidden] { display: none; }
    .odds h2 {
      margin: 0 0 2px;
      font-size: clamp(1.15rem, 5.4vw, 1.6rem);
      font-weight: 900;
      text-align: right;
    }
    .race { transition: opacity .35s; }
    .race.fade { opacity: 0; }
    .race-label { margin: 0 0 4px; font-size: .8rem; color: var(--muted); text-align: right; text-transform: uppercase; letter-spacing: .06em; }
    .cand { margin: 0 0 6px; }
    .cand-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-weight: 800; }
    .cand-head .pct { font-variant-numeric: tabular-nums; }
    .bar { height: 10px; background: var(--track); border: 2px solid var(--line); margin-top: 2px; }
    .bar > span { display: block; height: 100%; background: var(--other); transition: width .4s; }
    .bar > span.rep { background: var(--accent); }
    .odds-src { margin: 2px 0 0; font-size: .68rem; color: var(--muted); text-align: right; }

    /* ---- Arrow ---- */
    .arrow { grid-area: arrow; margin: -4px 0 -6px; }
    .arrow svg { display: block; width: 100%; height: auto; overflow: visible; }
    .arrow .landscape { display: none; }
    .arrow text { font-family: var(--font); font-weight: 800; fill: var(--ink); }

    /* ---- List ---- */
    .list { grid-area: list; }
    ol { list-style: none; margin: 0; padding: 0; counter-reset: slot; }
    ol li {
      counter-increment: slot;
      display: flex; align-items: flex-end; gap: 10px;
      height: 42px;
    }
    ol li::before {
      content: counter(slot) ".";
      width: 1.8em; text-align: right;
      font-size: 1.2rem; font-weight: 800;
      padding-bottom: 6px;
    }
    ol input {
      flex: 1; min-width: 0;
      font: inherit; font-size: 1.15rem; font-weight: 600; color: var(--ink);
      border: 0; border-bottom: 2px solid var(--line); border-radius: 0;
      background: transparent;
      padding: 6px 2px 4px;
    }
    ol input:focus { outline: none; border-bottom-color: var(--accent); }
    ol input::placeholder { color: transparent; }

    /* ---- Buttons (shadowed shapes) ---- */
    .foot { grid-area: foot; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .btn {
      font: inherit; font-weight: 800; font-size: 1.05rem; color: var(--ink);
      background: var(--bg);
      border: 2px solid var(--line);
      box-shadow: var(--shadow);
      padding: 8px 16px; min-height: 44px;
      cursor: pointer;
    }
    .btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--accent); }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .expand {
      position: relative;
      font: inherit; font-weight: 700; font-style: italic; color: var(--ink);
      background: none; border: 0; padding: 0; cursor: pointer;
      min-width: 11em; min-height: 44px; text-align: center;
    }
    .expand .say, .expand .down { transition: opacity .4s; }
    .expand .down {
      position: absolute; inset: 0;
      display: grid; place-items: center;
      opacity: 0;
    }
    .expand .down svg { height: 38px; width: auto; overflow: visible; }
    .expand.flip .say { opacity: 0; }
    .expand.flip .down { opacity: 1; }
    .add { width: 44px; padding: 0; font-size: 1.6rem; line-height: 1; margin: 10px 0 0 2.6em; }
    [hidden] { display: none !important; }

    /* Landscape and wide screens: the sketch layout. */
    @media (orientation: landscape) and (min-width: 600px) {
      .app {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto auto 1fr auto;
        grid-template-areas:
          "head head"
          "list odds"
          "list arrow"
          "foot arrow";
        column-gap: 28px;
        border: 2px solid var(--line);
        margin-top: 12px;
      }
      h1 { font-size: clamp(1.6rem, 4.2vw, 3rem); }
      .arrow { margin: 0 0 0 -40%; align-self: end; justify-self: end; }
      .arrow svg.landscape { width: auto; height: min(36vh, 230px); }
      .arrow .portrait { display: none; }
      .arrow .landscape { display: block; }
      .foot { justify-content: flex-start; }
      .list li { height: clamp(34px, 9vh, 46px); }
    }

    @media print {
      .odds, .arrow, .foot, .add { display: none !important; }
      .app { display: block; border: 0; }
      h1 { font-size: 24pt; margin-bottom: 12pt; }
      ol li { height: 36pt; }
      ol input { font-size: 16pt; }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1><span>Bring your crew.</span> <span>Have an impact!</span></h1>

    <section class="odds" id="odds" aria-label="Race odds" hidden>
      <h2>Change the odds!</h2>
      <div class="race" id="race" aria-live="polite"></div>
      <p class="odds-src" id="odds-src"></p>
    </section>

    <div class="arrow" aria-hidden="true">
      <svg class="portrait" id="arrow-p" viewBox="0 0 400 120"></svg>
      <svg class="landscape" id="arrow-l" viewBox="0 0 420 210"></svg>
    </div>

    <section class="list" aria-label="Who will you bring to the polls?">
      <ol id="slots"></ol>
      <button type="button" class="btn add" id="add" aria-label="Add another name" hidden>+</button>
    </section>

    <div class="foot">
      <button type="button" class="btn" id="print">Print a copy!</button>
      <button type="button" class="expand" id="expand" aria-label="Popular? Expand your list to ten names">
        <span class="say">Popular? Expand your list!</span>
        <span class="down" aria-hidden="true">
          <svg viewBox="0 0 40 44"><path d="M13 2h14v20h10L20 42 3 22h10z" fill="#c8102e" transform="translate(4 3)"/><path d="M13 2h14v20h10L20 42 3 22h10z" fill="#fff" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/></svg>
        </span>
      </button>
    </div>
  </main>

  <script>
    (function () {
      'use strict';
      // ---- Page settings ----
      var SHOW_ODDS = true;      // false removes the odds tracker
      var START = 5;             // names shown at first
      var EXPANDED = 10;         // names after "Expand your list"
      var MAX = 50;              // most names the "+" button allows
      var RACE_SECONDS = 15;     // time on each race before switching
      var EXPAND_SECONDS = 5;    // text / arrow swap on the expand button

      var KEY = 'votingCrew.v2';
      var slotsEl = document.getElementById('slots');
      var addBtn = document.getElementById('add');
      var expandBtn = document.getElementById('expand');
      var accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
      var state = load();

      function load() {
        var s = { names: [], expanded: false };
        try {
          var raw = JSON.parse(localStorage.getItem(KEY) || 'null');
          if (raw && Array.isArray(raw.names)) {
            s.names = raw.names.slice(0, MAX).map(function (n) { return typeof n === 'string' ? n.slice(0, 60) : ''; });
            s.expanded = raw.expanded === true;
          }
        } catch (e) {}
        var want = s.expanded ? Math.max(EXPANDED, s.names.length) : START;
        while (s.names.length < want) s.names.push('');
        return s;
      }
      function save() {
        try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
      }

      function addSlot(i, focus) {
        var li = document.createElement('li');
        var input = document.createElement('input');
        input.type = 'text';
        input.maxLength = 60;
        input.value = state.names[i] || '';
        input.setAttribute('aria-label', 'Name ' + (i + 1));
        input.setAttribute('autocomplete', 'off');
        input.setAttribute('autocapitalize', 'words');
        input.setAttribute('spellcheck', 'false');
        input.addEventListener('input', function () { state.names[i] = input.value; save(); });
        li.appendChild(input);
        slotsEl.appendChild(li);
        if (focus) input.focus();
      }
      function render() {
        slotsEl.textContent = '';
        state.names.forEach(function (_, i) { addSlot(i); });
        expandBtn.hidden = state.expanded;
        addBtn.hidden = !state.expanded || state.names.length >= MAX;
      }

      expandBtn.addEventListener('click', function () {
        state.expanded = true;
        var first = state.names.length;
        while (state.names.length < EXPANDED) state.names.push('');
        save(); render();
        var inputs = slotsEl.querySelectorAll('input');
        if (inputs[first]) inputs[first].scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
      addBtn.addEventListener('click', function () {
        if (state.names.length >= MAX) return;
        state.names.push('');
        save();
        addSlot(state.names.length - 1, true);
        addBtn.hidden = state.names.length >= MAX;
      });
      document.getElementById('print').addEventListener('click', function () { window.print(); });

      // "Popular? Expand your list!" swaps with a down arrow.
      setInterval(function () { expandBtn.classList.toggle('flip'); }, EXPAND_SECONDS * 1000);

      // ---- Curved arrows: "Who will you bring to the polls?" ----
      var NS = 'http://www.w3.org/2000/svg';
      function svgEl(tag, attrs) {
        var n = document.createElementNS(NS, tag);
        for (var k in attrs) n.setAttribute(k, attrs[k]);
        return n;
      }
      // Draws a thick curved band ending in an arrowhead, with a red offset shadow,
      // and the label written along the band (on a left-to-right copy of the curve).
      function drawArrow(svg, d, textD, width, fontSize) {
        var probe = svgEl('path', { d: d });
        svg.appendChild(probe);
        var len = probe.getTotalLength();
        var head = width * 1.15;
        var end = probe.getPointAtLength(len);
        var before = probe.getPointAtLength(len - 1);
        svg.removeChild(probe);
        var ux = end.x - before.x, uy = end.y - before.y;
        var m = Math.sqrt(ux * ux + uy * uy) || 1; ux /= m; uy /= m;
        var px = -uy, py = ux;                // perpendicular
        var tip = { x: end.x + ux * head, y: end.y + uy * head };
        var w = width * 1.05;
        var tri = [tip.x, tip.y, end.x + px * w, end.y + py * w, end.x - px * w, end.y - py * w].map(function (v) { return v.toFixed(1); });
        var triPts = tri[0] + ',' + tri[1] + ' ' + tri[2] + ',' + tri[3] + ' ' + tri[4] + ',' + tri[5];

        var shadow = svgEl('g', { transform: 'translate(6 6)' });
        shadow.appendChild(svgEl('path', { d: d, fill: 'none', stroke: accent, 'stroke-width': width + 4 }));
        shadow.appendChild(svgEl('polygon', { points: triPts, fill: accent, stroke: accent, 'stroke-width': 4, 'stroke-linejoin': 'round' }));
        svg.appendChild(shadow);
        svg.appendChild(svgEl('path', { d: d, fill: 'none', stroke: '#111', 'stroke-width': width + 5 }));
        svg.appendChild(svgEl('polygon', { points: triPts, fill: '#fff', stroke: '#111', 'stroke-width': 2.5, 'stroke-linejoin': 'round' }));
        svg.appendChild(svgEl('path', { d: d, fill: 'none', stroke: '#fff', 'stroke-width': width }));

        var id = svg.id + '-t';
        var defs = svgEl('defs', {});
        defs.appendChild(svgEl('path', { id: id, d: textD }));
        svg.appendChild(defs);
        var text = svgEl('text', { 'font-size': fontSize, 'dominant-baseline': 'central' });
        var tp = svgEl('textPath', { href: '#' + id, startOffset: '50%', 'text-anchor': 'middle' });
        tp.textContent = 'Who will you bring to the polls?';
        text.appendChild(tp);
        svg.appendChild(text);
      }
      // Portrait: sweeps from the odds (top right) down to the list (bottom left).
      drawArrow(document.getElementById('arrow-p'),
        'M392 22 C 300 88, 150 30, 52 78',
        'M44 82 C 150 30, 300 88, 400 18', 30, 17);
      // Landscape: sweeps from bottom right up toward the list on the left.
      drawArrow(document.getElementById('arrow-l'),
        'M396 112 C 330 200, 130 200, 70 92',
        'M72 92 C 130 200, 330 200, 398 108', 36, 18);

      render();

      // ---- Odds: rotates between races, Republican always on top ----
      if (!SHOW_ODDS) return;
      var oddsEl = document.getElementById('odds');
      var raceEl = document.getElementById('race');
      var srcEl = document.getElementById('odds-src');

      function el(tag, cls, text) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text !== undefined) n.textContent = text;
        return n;
      }
      // Whole-number percents that always add to 100 (largest-remainder method).
      function wholePercents(list) {
        var raw = list.map(function (c) { return c.chance === null ? 0 : c.chance * 100; });
        var floors = raw.map(Math.floor);
        var left = 100 - floors.reduce(function (a, b) { return a + b; }, 0);
        raw.map(function (v, i) { return { i: i, r: v - Math.floor(v) }; })
          .sort(function (a, b) { return b.r - a.r || a.i - b.i; })
          .slice(0, Math.max(0, left))
          .forEach(function (o) { floors[o.i] += 1; });
        return floors;
      }
      function showRace(race) {
        var cands = race.candidates.slice().sort(function (a, b) {
          return (b.partyKey === 'R') - (a.partyKey === 'R');
        });
        var whole = wholePercents(cands);
        raceEl.textContent = '';
        raceEl.appendChild(el('p', 'race-label', race.label + (race.subtitle && race.subtitle !== 'Ohio' ? ' · ' + race.subtitle : ' · Ohio')));
        cands.forEach(function (c, i) {
          var wrap = el('div', 'cand');
          var head = el('div', 'cand-head');
          head.appendChild(el('span', '', c.name));
          head.appendChild(el('span', 'pct', c.chance === null ? '—' : whole[i] + '%'));
          wrap.appendChild(head);
          var bar = el('div', 'bar');
          var fill = el('span', c.partyKey === 'R' ? 'rep' : '');
          fill.style.width = (c.chance === null ? 0 : whole[i]) + '%';
          bar.appendChild(fill);
          wrap.appendChild(bar);
          raceEl.appendChild(wrap);
        });
      }
      function start(data) {
        if (!data || !Array.isArray(data.races) || !data.races.length) return;
        var i = 0;
        showRace(data.races[0]);
        srcEl.textContent = 'Kalshi market odds, not a poll.';
        oddsEl.hidden = false;
        if (data.races.length < 2) return;
        setInterval(function () {
          raceEl.classList.add('fade');
          setTimeout(function () {
            i = (i + 1) % data.races.length;
            showRace(data.races[i]);
            raceEl.classList.remove('fade');
          }, 350);
        }, RACE_SECONDS * 1000);
      }
      // Failure leaves the odds hidden; the list keeps working on its own.
      fetch('/api/odds')
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(start)
        .catch(function () {});
    })();
  </script>
</body>
</html>
